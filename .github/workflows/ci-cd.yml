name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Replace with your specific Python version
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # If you also have a requirements.txt file, uncomment the next line:
          pip install -r requirements.txt
          
      - name: Run tests
        run: pytest


